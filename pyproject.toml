[project]
name = "geointel"
version = "0.1.0"
description = "GeoIntel — Semantic Retrieval and Multi-Temporal Geospatial Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.0.0",
  "geopandas>=1.0.1",
  "rasterio>=1.4.3",
  "shapely>=2.0.4",
  "pyproj>=3.6.1",
  "pystac>=1.10.1",
  "pystac-client>=0.8.2",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "requests>=2.32.0",
  "python-dotenv>=1.0.1",
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
